---
- name: Configure k3s server
  hosts: k3s_server
  become: true
  vars:
    k3s_install_args: "server --write-kubeconfig-mode 0644 --node-ip {{ ansible_host }} --advertise-address {{ ansible_host }} --tls-san {{ ansible_host }}"
  roles:
    - k3s
  tasks:
    - name: Wait for k3s node token
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 120

    - name: Read k3s node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_raw

    - name: Store k3s node token for agent play
      ansible.builtin.set_fact:
        k3s_node_token: "{{ k3s_token_raw.content | b64decode | trim }}"

    - name: Wait for Kubernetes API
      ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes
      register: k3s_nodes
      changed_when: false
      retries: 12
      delay: 5
      until: k3s_nodes.rc == 0
