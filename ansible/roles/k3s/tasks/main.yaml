---
- name: Check whether k3s is installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install k3s
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" {{ k3s_install_args }} sh -
  args:
    executable: /bin/bash
  when: not k3s_binary.stat.exists

- name: Ensure k3s service is running
  ansible.builtin.service:
    name: "{{ k3s_service_name }}"
    state: started
    enabled: true
