#cloud-config
hostname: ubuntu-vm
manage_etc_hosts: true

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin
    shell: /bin/bash
    lock_passwd: false
    passwd: $6$rounds=4096$changemehash

ssh_pwauth: true

package_update: true
packages:
  - qemu-guest-agent
  - curl
  - vim
  - git
